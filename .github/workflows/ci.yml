name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-courseware:
    name: Windows paired courseware integration
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DECKWISE_COURSEWARE_RELEASE: '1'
      DECKWISE_COURSEWARE_LOCK: ${{ github.workspace }}/apps/desktop/resources/courseware-release-lock.json
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT
          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build
          wait "$host_build_pid"
          trap - EXIT

      - name: Check Windows transforms and package lifecycle
        run: node --test apps/desktop/test/wiseoffice-build-paths.test.mjs apps/desktop/test/courseware-package-verification.test.mjs

      - name: Build and verify paired editor and native worker
        uses: ./.github/actions/prepare-courseware

      - name: Build Windows installers
        run: pnpm --filter @pi-desktop/desktop run dist:win -- --x64

      - name: Verify final Windows package
        run: node scripts/check-courseware-package.mjs

  js:
    name: JS build / typecheck / lint / architecture / test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Match the Node that Electron 43 bundles (24.18), so CI type-checks
          # and tests against the same runtime the app actually ships.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Courseware workflow contract gate
        run: pnpm test:courseware-workflow

      - name: Typecheck Desktop
        # Workspace dependency builds already run tsc; Vite does not check the app.
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Check architecture budgets
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-architecture.mjs

      - name: Install browser test runtime
        run: pnpm --filter @pi-desktop/courseware-runtime exec playwright install --with-deps --only-shell chromium

      - name: Unit tests
        run: pnpm -r --if-present test

  rust:
    name: Rust host-core format / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test -p host-core --locked
