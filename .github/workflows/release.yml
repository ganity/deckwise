# Release pipeline
#
# Trigger: push a tag `vX.Y.Z` (must match apps/desktop/package.json version).
# The easiest way to cut a release:
#
#   node scripts/release.mjs 0.2.0 --tag   # bump versions + commit + create tag v0.2.0
#   git push origin <branch> v0.2.0        # push → this workflow builds & publishes
#
# Builds installers for every platform defined in the electron-builder config
# (macOS dmg/zip arm64 and x64, Windows NSIS and portable x64, Linux
# AppImage/deb/rpm x64), each
# with its native pi-desktop-host-core Rust sidecar. The Linux app.asar is also
# exported as a system-Electron repackaging asset. Installers and their
# electron-updater latest*.yml feeds are published to Alibaba Cloud OSS; the
# existing GitHub Release remains a backup artifact archive (D126/D285/D364).

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Sign and notarize macOS artifacts for this run'
        required: false
        default: false
        type: boolean

# Least privilege by default; only the publish job needs to write the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Same gate as ci.yml. A tag push does not trigger ci.yml, so without this
    # job a broken tree could be built and published untested.
    name: Verify (build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - name: Typecheck Desktop
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Courseware workflow contract gate
        run: pnpm test:courseware-workflow

      - name: Lint
        run: pnpm lint

      - name: Install browser test runtime
        run: pnpm --filter @pi-desktop/courseware-runtime exec playwright install --with-deps --only-shell chromium

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Rust host-core test
        run: cargo test -p host-core --locked

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    env:
      DECKWISE_COURSEWARE_RELEASE: '1'
      DECKWISE_COURSEWARE_LOCK: ${{ github.workspace }}/apps/desktop/resources/courseware-release-lock.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            arch: arm64
            runner_arch: arm64
            artifact: mac-arm64
            platform: macos
            dist: dist:mac
          - name: macOS Intel x64
            os: macos-15-intel
            arch: x64
            runner_arch: x86_64
            artifact: mac-x64
            platform: macos
            dist: dist:mac
          - name: Windows x64
            os: windows-latest
            arch: x64
            artifact: windows-x64
            platform: windows
            dist: dist:win
          - name: Linux x64
            # Ubuntu 22.04 keeps host-core at glibc 2.35 so Ubuntu 22.04,
            # Debian 12, and Fedora 36+ can load the binary. ubuntu-latest
            # (24.04) would raise the floor to 2.39.
            os: ubuntu-22.04
            arch: x64
            artifact: linux-x64
            platform: linux
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Verify native macOS runner architecture
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.runner_arch }}"
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::Expected $expected_arch runner, got $actual_arch."
            exit 1
          fi

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            echo "Run 'node scripts/release.mjs $TAG_VERSION --tag' to bump versions before tagging."
            exit 1
          fi

      - name: Validate bundled models.dev catalog
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const path = 'apps/desktop/resources/models.dev/api.json';
          const catalog = JSON.parse(await readFile(path, 'utf8'));
          const valid = catalog && !Array.isArray(catalog) && typeof catalog === 'object' &&
            Object.values(catalog).some((provider) => provider && typeof provider === 'object' && provider.models);
          if (!valid) throw new Error(`${path} contains no provider model records`);
          console.log(`${path} is valid`);
          NODE

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Match the Node that Electron 43 bundles (24.18), so the released
          # artifacts are built against the runtime the app actually ships.
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare package inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      - name: Verify Windows archive extraction
        if: matrix.platform == 'windows'
        run: node --test apps/desktop/test/python-runtime-contract.test.mjs

      - name: Prepare paired courseware inputs
        uses: ./.github/actions/prepare-courseware

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cpio rpm xvfb libasound2 libatk-bridge2.0-0 libgtk-3-0 libnss3

      - name: Package installers (${{ matrix.dist }})
        if: matrix.platform != 'macos'
        # The dist scripts pass --publish never themselves: electron-builder
        # must not self-publish on tag builds (no token; softprops owns it).
        # The explicit architecture keeps the package and native Rust sidecar
        # aligned with the runner selected by this matrix entry.
        run: pnpm --filter @pi-desktop/desktop run ${{ matrix.dist }} -- --${{ matrix.arch }}

      - name: Package unsigned macOS installer
        if: matrix.platform == 'macos' && inputs.sign_macos != true
        env:
          # Default release lane: macOS artifacts stay unsigned unless a
          # workflow_dispatch run explicitly sets sign_macos=true.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          # Artifact names are defined in apps/desktop/package.json: the mac
          # pattern labels ZIPs, and the dmg target pattern labels DMGs.
          pnpm --filter @pi-desktop/desktop run dist:mac -- --${{ matrix.arch }}

      - name: Package signed and notarized macOS installer
        if: matrix.platform == 'macos' && inputs.sign_macos == true
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Artifact names are defined in apps/desktop/package.json: the mac
          # pattern labels ZIPs, and the dmg target pattern labels DMGs.
          pnpm --filter @pi-desktop/desktop run dist:mac -- --${{ matrix.arch }} \
            -c.mac.forceCodeSigning=true \
            -c.mac.notarize=true

      - name: Staple macOS installer ticket
        if: matrix.platform == 'macos' && inputs.sign_macos == true
        run: scripts/staple-macos-release-dmg.sh apps/desktop/release

      - name: Verify signed and notarized macOS installer
        if: matrix.platform == 'macos' && inputs.sign_macos == true
        run: scripts/verify-macos-release.sh apps/desktop/release

      - name: Verify Linux host-core glibc floor
        if: matrix.platform == 'linux'
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Verify packaged courseware payload
        run: node scripts/check-courseware-package.mjs

      - name: Exercise the final Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/courseware-appimage"
          appimage=$(realpath apps/desktop/release/*.AppImage)
          (cd "$RUNNER_TEMP/courseware-appimage" && "$appimage" --appimage-extract > /dev/null)
          export DECKWISE_E2E_PACKAGE_ROOT="$RUNNER_TEMP/courseware-appimage/squashfs-root"
          export DECKWISE_E2E_OUTPUT="$RUNNER_TEMP/courseware-package-acceptance"
          node scripts/check-courseware-package.mjs "$DECKWISE_E2E_PACKAGE_ROOT"
          xvfb-run -a node scripts/e2e-maic-courseware.mjs
          cp "$DECKWISE_E2E_OUTPUT/report.json" apps/desktop/release/courseware-acceptance-linux-x64.json

      - name: Export Linux ASAR release asset
        if: matrix.platform == 'linux'
        run: node scripts/export-linux-asar.mjs

      - name: Verify macOS artifact names
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_dmg=(apps/desktop/release/DeckWise-*-${{ matrix.arch }}.dmg)
          expected_dmg_blockmap=(apps/desktop/release/DeckWise-*-${{ matrix.arch }}.dmg.blockmap)
          expected_zip=(apps/desktop/release/DeckWise-*-${{ matrix.arch }}-mac.zip)
          expected_zip_blockmap=(apps/desktop/release/DeckWise-*-${{ matrix.arch }}-mac.zip.blockmap)
          if [[ "${#expected_dmg[@]}" -ne 1 || "${#expected_dmg_blockmap[@]}" -ne 1 || "${#expected_zip[@]}" -ne 1 || "${#expected_zip_blockmap[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one ${{ matrix.arch }} DMG, DMG blockmap, ZIP, and ZIP blockmap."
            printf '%s\n' apps/desktop/release/* || true
            exit 1
          fi
          for artifact in apps/desktop/release/DeckWise-*; do
            case "$artifact" in
              *-${{ matrix.arch }}.dmg|*-${{ matrix.arch }}.dmg.blockmap|*-${{ matrix.arch }}-mac.zip|*-${{ matrix.arch }}-mac.zip.blockmap) ;;
              *)
                echo "::error::Unexpected unlabelled or wrong-architecture macOS artifact: $artifact"
                exit 1
                ;;
            esac
          done

      - name: Disambiguate macOS update metadata
        if: matrix.platform == 'macos'
        run: mv apps/desktop/release/latest-mac.yml apps/desktop/release/latest-mac-${{ matrix.arch }}.yml

      - name: Record final artifact checksums
        run: node scripts/courseware-artifact-checksums.mjs

      - name: Install ossutil
        uses: ./.github/actions/setup-ossutil

      - name: Upload artifacts to OSS staging
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-beijing
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_STAGING_PREFIX: oss://trainwise/deckwise/builds/${{ github.run_id }}/${{ matrix.artifact }}
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?Configure the OSS_ACCESS_KEY_ID repository secret}"
          : "${OSS_ACCESS_KEY_SECRET:?Configure the OSS_ACCESS_KEY_SECRET repository secret}"
          shopt -s nullglob
          artifacts=(
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.asar
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/courseware-*.json
            apps/desktop/release/SHA256SUMS-*.txt
          )
          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "::error::No release artifacts found."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            ossutil cp "$artifact" "$OSS_STAGING_PREFIX/$(basename "$artifact")" \
              -f --cache-control "no-cache,max-age=0,must-revalidate"
          done

  publish:
    name: Publish OSS Feed and GitHub Backup
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install ossutil
        uses: ./.github/actions/setup-ossutil

      - name: Download staged artifacts from OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-beijing
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_STAGING_PREFIX: oss://trainwise/deckwise/builds/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in mac-arm64 mac-x64 windows-x64 linux-x64; do
            ossutil cp "$OSS_STAGING_PREFIX/$platform/" dist/ -r -f
          done

      - name: List artifacts
        run: ls -la dist/

      - name: Merge macOS updater metadata
        working-directory: dist
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"

          paths = Dir["latest-mac-*.yml"].sort
          expected_paths = ["latest-mac-arm64.yml", "latest-mac-x64.yml"]
          abort "Expected both macOS updater feeds" unless paths == expected_paths

          feeds = paths.map do |path|
            YAML.safe_load(File.read(path), permitted_classes: [], aliases: false)
          end
          versions = feeds.map { |feed| feed.fetch("version") }.uniq
          abort "macOS updater feeds disagree on version" unless versions.length == 1

          files = feeds.flat_map { |feed| feed.fetch("files") }
            .uniq { |file| file.fetch("url") }
          zip = files.find { |file| file.fetch("url").end_with?(".zip") }
          abort "macOS updater feeds contain no ZIP" if zip.nil?

          merged = feeds.first.merge(
            "version" => versions.first,
            "files" => files,
            "path" => zip.fetch("url"),
            "sha512" => zip.fetch("sha512"),
          )
          File.write("latest-mac.yml", merged.to_yaml)
          RUBY
          rm latest-mac-arm64.yml latest-mac-x64.yml

      - name: Generate download page manifest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MAC_SIGNED: ${{ inputs.sign_macos == true }}
        run: |
          set -euo pipefail
          signing_flag=()
          if [[ "$MAC_SIGNED" == "true" ]]; then signing_flag=(--mac-signed); fi
          node scripts/create-download-manifest.mjs dist "${RELEASE_TAG#v}" "${signing_flag[@]}"

      - name: Publish update feed to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-beijing
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?Configure the OSS_ACCESS_KEY_ID repository secret}"
          : "${OSS_ACCESS_KEY_SECRET:?Configure the OSS_ACCESS_KEY_SECRET repository secret}"
          for artifact in dist/*; do
            case "$artifact" in
              dist/latest*.yml|dist/downloads.json) continue ;;
            esac
            ossutil cp "$artifact" "oss://trainwise/deckwise/$(basename "$artifact")" \
              -f --cache-control "public,max-age=31536000,immutable"
          done
          for metadata in dist/latest*.yml; do
            ossutil cp "$metadata" "oss://trainwise/deckwise/$(basename "$metadata")" \
              -f --cache-control "no-cache,max-age=0,must-revalidate" --content-type "application/yaml"
          done
          if [[ -f dist/downloads.json ]]; then
            ossutil cp dist/downloads.json oss://trainwise/deckwise/downloads.json \
              -f --cache-control "no-cache,max-age=0,must-revalidate" --content-type "application/json"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # D126/D285/D364: all desktop platforms and both native macOS
          # architectures ship from tag builds — installers, the Windows
          # portable exe, the Linux ASAR, blockmaps, and the latest*.yml
          # feeds that drive electron-updater on each platform (in-app for
          # Windows NSIS and Linux AppImage; macOS and Windows portable remain
          # manual-delivery by product policy).
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Remove published OSS staging artifacts
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: cn-beijing
          OSS_ENDPOINT: https://oss-cn-beijing.aliyuncs.com
          OSS_STAGING_PREFIX: oss://trainwise/deckwise/builds/${{ github.run_id }}
        run: ossutil rm "$OSS_STAGING_PREFIX/" -r -f
