name: Linux package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DECKWISE_COURSEWARE_RELEASE: '1'
      DECKWISE_COURSEWARE_LOCK: ${{ github.workspace }}/apps/desktop/resources/courseware-release-lock.json
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare package inputs
        # Mirrors release.yml: build host-core with --locked so a drifted
        # Cargo.lock fails here instead of being silently rewritten by the
        # desktop `build:host-release` script, which does not pass --locked.
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      - name: Prepare paired courseware inputs
        uses: ./.github/actions/prepare-courseware

      - name: Install RPM inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cpio rpm xvfb libasound2 libatk-bridge2.0-0 libgtk-3-0 libnss3

      - name: Build Linux packages
        run: pnpm --filter @pi-desktop/desktop run dist:linux -- --x64

      - name: Verify Linux host glibc floor
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Verify packaged courseware payload
        run: node scripts/check-courseware-package.mjs

      - name: Exercise the final Linux AppImage
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/courseware-appimage"
          appimage=$(realpath apps/desktop/release/*.AppImage)
          (cd "$RUNNER_TEMP/courseware-appimage" && "$appimage" --appimage-extract > /dev/null)
          export DECKWISE_E2E_PACKAGE_ROOT="$RUNNER_TEMP/courseware-appimage/squashfs-root"
          export DECKWISE_E2E_OUTPUT="$RUNNER_TEMP/courseware-package-acceptance"
          node scripts/check-courseware-package.mjs "$DECKWISE_E2E_PACKAGE_ROOT"
          xvfb-run -a node scripts/e2e-maic-courseware.mjs
          cp "$DECKWISE_E2E_OUTPUT/report.json" apps/desktop/release/courseware-acceptance-linux-x64.json

      - name: Preserve failed package acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: courseware-acceptance-linux-x64-failure
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/courseware-package-acceptance

      - name: Record final artifact checksums
        run: node scripts/courseware-artifact-checksums.mjs

      - name: Verify RPM package
        run: |
          set -euo pipefail
          mapfile -t packages < <(find apps/desktop/release -maxdepth 1 -type f -name '*.rpm' -print)
          test "${#packages[@]}" -eq 1
          rpm -qip "${packages[0]}"
          rpm_package=$(realpath "${packages[0]}")
          rpm_file_list=$(mktemp)
          rpm -qpl "$rpm_package" > "$rpm_file_list"
          if grep -E '^/usr/lib/\.build-id' "$rpm_file_list" >/dev/null; then
            echo 'RPM must not ship global build-id links for bundled Electron binaries'
            exit 1
          fi
          grep -Fx '/opt/DeckWise/resources/app.asar' "$rpm_file_list" >/dev/null
          grep -Fx '/opt/DeckWise/resources/bin/pi-desktop-host-core' "$rpm_file_list" >/dev/null
          grep -Fx '/usr/share/applications/deckwise.desktop' "$rpm_file_list" >/dev/null
          grep -Fx '/usr/share/icons/hicolor/512x512/apps/deckwise.png' "$rpm_file_list" >/dev/null

          desktop_root=$(mktemp -d)
          (
            cd "$desktop_root"
            rpm2cpio "$rpm_package" | cpio --quiet -id './usr/share/applications/deckwise.desktop'
          )
          desktop_entry="$desktop_root/usr/share/applications/deckwise.desktop"
          grep -Fx 'Icon=deckwise' "$desktop_entry" >/dev/null
          grep -Fx 'StartupWMClass=deckwise' "$desktop_entry" >/dev/null

      - name: Upload validated Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: deckwise-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/courseware-*.json
            apps/desktop/release/SHA256SUMS-*.txt
